<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10253a"><link rel="manifest" href="manifest.webmanifest"><title>Wefit Coach Cloud</title><style>
:root{font-family:system-ui,-apple-system,'Noto Sans TC',sans-serif;color:#162c3d;background:#f3f6f9}*{box-sizing:border-box}body{margin:0}header{background:#10253a;color:white;padding:18px 5vw;display:flex;justify-content:space-between;align-items:center;gap:10px}header b{font-size:22px}main{max-width:1000px;margin:auto;padding:20px}section{background:white;border:1px solid #e0e7ee;border-radius:16px;padding:20px;margin:15px 0;box-shadow:0 4px 14px #10253a08}h2{margin-top:0}input,select,button{font:inherit;padding:11px;border-radius:9px;border:1px solid #c5d0dc;max-width:100%}input{width:100%}button{background:#116f90;color:white;border:0;cursor:pointer}button:disabled{opacity:.5}button.secondary{background:#e5edf2;color:#173b4d}form{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;align-items:end}label{display:grid;gap:5px;font-size:13px;color:#4c6477}table{border-collapse:collapse;width:100%}th,td{text-align:left;padding:12px;border-bottom:1px solid #edf0f4}td{overflow-wrap:anywhere}.scroll{overflow-x:auto}.muted{color:#647b8c}.pill{display:inline-block;background:#e7f4f6;border-radius:30px;padding:4px 10px}#notice{padding:10px 15px;border-radius:8px;background:#fff3d7;color:#715317;margin-top:15px}nav{display:flex;gap:8px;flex-wrap:wrap}nav button{background:#29445a}nav button.active{background:#09a4a1}.metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.metric{background:#f1f8f9;border-radius:12px;padding:14px}.metric strong{font-size:26px;display:block}@media(max-width:550px){.metrics{grid-template-columns:1fr 1fr}header{align-items:flex-start;flex-direction:column}main{padding:12px}section{padding:15px}th,td{padding:8px;font-size:13px}}
</style></head><body><header><b>WEFIT <span style="color:#50dbcf">Coach Cloud</span></b><span id="identity">雲端測試版 V2</span></header><main><div id="notice">這是雲端測試版；未設定 Supabase 前無法登入或同步。請勿輸入真實學員個資。</div><section id="auth"><h2>教練登入 / 註冊</h2><form id="login"><label>電子郵件<input id="email" type="email" required autocomplete="email"></label><label>密碼（至少 6 字元）<input id="password" type="password" minlength="6" required autocomplete="current-password"></label><button type="submit">登入</button><button type="button" class="secondary" id="signup">註冊測試帳號</button></form></section><div id="app" hidden><nav><button data-tab="dashboard">總覽</button><button data-tab="members">學員</button><button data-tab="lessons">排課</button><button data-tab="purchases">購課</button><button class="secondary" id="logout">登出</button></nav><section id="content"></section></div></main><script src="config.js"></script><script type="module" src="app.js"></script></body></html>
